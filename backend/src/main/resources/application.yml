spring:
  application:
    name: mallalab
  datasource:
    url: "jdbc:h2:mem:mallalab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs

mallalab:
  seed:
    enabled: true

logging:
  level:
    org.hibernate.SQL: warn
