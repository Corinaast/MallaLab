services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mallalab
      POSTGRES_USER: mallalab
      POSTGRES_PASSWORD: mallalab
    ports:
      - "5432:5432"
    volumes:
      - mallalab-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mallalab -d mallalab"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mallalab
      SPRING_DATASOURCE_USERNAME: mallalab
      SPRING_DATASOURCE_PASSWORD: mallalab
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mallalab-data:
